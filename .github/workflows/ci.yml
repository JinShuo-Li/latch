name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new commit supersedes an older smoke run on the same branch or PR.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install runtime prerequisites
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y bubblewrap ripgrep shellcheck python3-venv
      - name: Check Linux installer and scripts
        run: |
          shellcheck scripts/install.sh scripts/fetch-references.sh scripts/test-fetch-references.sh
          python3 scripts/test_install.py
          bash scripts/test-fetch-references.sh
      - name: Enable Bubblewrap user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch, pinned; the action still installs current stable
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: smoke
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all -- --check
      # Compile separately so a stalled test cannot look like a slow build.
      - name: Compile smoke targets
        timeout-minutes: 12
        run: |
          cargo test -p latch-kernel --test invariants --no-run --locked
          cargo test -p latch-kernel --lib --no-run --locked
          cargo build -p latch-cli --locked
      - name: Architecture invariants
        timeout-minutes: 2
        run: cargo test -p latch-kernel --test invariants --locked
      - name: Probe mandatory Linux sandbox
        timeout-minutes: 2
        run: cargo test -p latch-kernel --lib sandbox::tests::probe_succeeds_on_this_host --locked
      - name: Start Latch
        timeout-minutes: 1
        run: target/debug/latch --version

      - name: Real TUI startup and interaction through PTY
        timeout-minutes: 3
        run: |
          python3 -m venv "$RUNNER_TEMP/tui-venv"
          "$RUNNER_TEMP/tui-venv/bin/python" -m pip install -r scripts/requirements-tui.txt
          "$RUNNER_TEMP/tui-venv/bin/python" scripts/test_tui_pty.py target/debug/latch
      - name: Upload real TUI screen captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tui-pty-${{ runner.os }}
          path: target/tui-pty/
          if-no-files-found: warn
          retention-days: 7

  windows-smoke:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch, pinned; the action still installs current stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: smoke
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check Windows installer (PowerShell 7 and Windows PowerShell 5.1)
        shell: pwsh
        run: |
          & scripts/test-install.ps1
          powershell -NoProfile -File scripts/test-install.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Compile smoke targets
        timeout-minutes: 18
        shell: pwsh
        run: |
          cargo test -p latch-kernel --lib --no-run --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test -p latch-cli --test cli --no-run --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build -p latch-cli --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify embedded native boundary
        timeout-minutes: 3
        shell: pwsh
        run: |
          cargo test -p latch-kernel --lib native_shell_and_fixed_git_use_embedded_boundary --locked -- --test-threads=1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Windows Web transport
        timeout-minutes: 8
        shell: pwsh
        run: |
          cargo test -p latch-cli --test cli web_transport --locked -- --test-threads=1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Start Latch
        timeout-minutes: 1
        shell: pwsh
        run: |
          & target/debug/latch.exe --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $latchBinaryDir = (Resolve-Path target/debug).Path
          $env:PATH = "$latchBinaryDir;$env:PATH"
          if ((Get-Command latch -CommandType Application).Source -ne (Join-Path $latchBinaryDir 'latch.exe')) {
            throw 'PowerShell did not resolve the expected latch.exe after PATH setup'
          }
          latch --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  macos-smoke:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # pinned stable action
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: macos-smoke
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Runtime prerequisites
        run: brew install ripgrep
      - name: Compile
        timeout-minutes: 20
        run: |
          test "$(uname -m)" = arm64
          cargo test -p latch-kernel --lib --no-run --locked
          cargo test -p latch-cli --test cli --no-run --locked
          cargo build -p latch-cli --locked
      - name: Seatbelt boundary and installer checks
        timeout-minutes: 5
        run: |
          cargo test -p latch-kernel --lib execution::macos --locked
          python3 scripts/test_install.py
          target/debug/latch --version
      - name: Real CLI and Web startup with loopback mock provider
        timeout-minutes: 5
        run: |
          cargo test -p latch-cli --test cli macos_native_startup --locked -- --test-threads=1
          cargo test -p latch-cli --test cli run_text_mode_streams_assistant_text --locked
          cargo test -p latch-cli --test cli web_transport --locked -- --test-threads=1
      - name: Start stripped and ad-hoc signed Mach-O binary
        timeout-minutes: 1
        run: |
          cp target/debug/latch "$RUNNER_TEMP/latch-packaged"
          strip "$RUNNER_TEMP/latch-packaged"
          codesign --force --sign - "$RUNNER_TEMP/latch-packaged"
          codesign --verify "$RUNNER_TEMP/latch-packaged"
          "$RUNNER_TEMP/latch-packaged" --version

      - name: Real TUI startup and interaction through PTY
        timeout-minutes: 3
        run: |
          python3 -m venv "$RUNNER_TEMP/tui-venv"
          "$RUNNER_TEMP/tui-venv/bin/python" -m pip install -r scripts/requirements-tui.txt
          "$RUNNER_TEMP/tui-venv/bin/python" scripts/test_tui_pty.py target/debug/latch
      - name: Upload real TUI screen captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tui-pty-${{ runner.os }}
          path: target/tui-pty/
          if-no-files-found: warn
          retention-days: 7
