name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime prerequisites
        run: sudo apt-get update && sudo apt-get install -y bubblewrap ripgrep shellcheck
      - name: Check Linux installer
        run: |
          shellcheck scripts/install.sh
          python3 scripts/test_install.py
      - name: Enable Bubblewrap user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format and architecture invariants
        run: |
          cargo fmt --all -- --check
          cargo test -p latch-kernel --test invariants --locked
          cargo test -p latch-kernel --lib sandbox::tests::probe_succeeds_on_this_host --locked
      - name: Build and start Latch
        run: |
          cargo build -p latch-cli --locked
          target/debug/latch --version

  windows-smoke:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check Windows installer (PowerShell 7 and Windows PowerShell 5.1)
        shell: pwsh
        run: |
          & scripts/test-install.ps1
          powershell -NoProfile -File scripts/test-install.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify embedded native boundary
        shell: pwsh
        run: |
          cargo test -p latch-kernel --lib native_shell_and_fixed_git_use_embedded_boundary --locked -- --test-threads=1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and start Latch
        shell: pwsh
        run: |
          cargo build -p latch-cli --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & target/debug/latch.exe --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
