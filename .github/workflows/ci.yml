name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  reliability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic test prerequisites
        run: sudo apt-get update && sudo apt-get install -y bubblewrap ripgrep python3
      - name: Enable Bubblewrap user namespaces on this runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Deterministic 0.2.3 release gate
        run: bash scripts/release-gate.sh

  windows-native:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Windows test prerequisites
        shell: pwsh
        run: |
          choco install ripgrep --yes --no-progress --limit-output
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Command rg.exe -ErrorAction Stop | Select-Object -ExpandProperty Source
          $rgPackage = Join-Path $env:ChocolateyInstall 'lib/ripgrep'
          $rgBinary = Get-ChildItem -LiteralPath $rgPackage -Recurse -Filter rg.exe -File |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $rgBinary) { throw "Chocolatey ripgrep package has no standalone rg.exe under $rgPackage" }
          "LATCH_TEST_RG_EXE=$rgBinary" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build native boundary with strict MSVC warnings
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsVersion = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          $generator = switch -Regex ($vsVersion) {
            '^18\.' { 'Visual Studio 18 2026'; break }
            '^17\.' { 'Visual Studio 17 2022'; break }
            default { throw "Unsupported Visual Studio installation: $vsVersion" }
          }
          Write-Output "Using $generator ($vsVersion)"
          cmake -S native/windows/boundary -B target/windows-native-ci -G $generator -A x64 -DLATCH_RECOVERY_TESTING=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build target/windows-native-ci --config Release --parallel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Native recovery, filesystem and process security
        shell: pwsh
        run: |
          $binaries = Join-Path $PWD 'target/windows-native-ci/bin'
          $fixtureBase = Join-Path $env:LOCALAPPDATA ('LatchBoundaryCI-' + $env:GITHUB_RUN_ID)
          foreach ($suite in @('test', 'recovery', 'adversarial', 'lifecycle', 'developer', 'deleted_root')) {
            try {
              & "native/windows/boundary/$suite.ps1" -Binaries $binaries -FixtureRoot (Join-Path $fixtureBase "latch-native-$suite")
              if ($LASTEXITCODE) { throw "$suite exited $LASTEXITCODE" }
            } catch {
              $message = $_.Exception.Message -replace '[\r\n]+', ' '
              Write-Output "::error file=native/windows/boundary/$suite.ps1,title=Windows native fixture::$message"
              throw
            }
          }
      - name: Windows Rust release gate
        if: success() || failure()
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Native ACL recovery is intentionally serialized per Windows user.
          # Keep process fixtures from timing out while queued for that lock.
          $env:RUST_TEST_THREADS = '1'
          cargo test --workspace --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --release --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
