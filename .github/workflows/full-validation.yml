name: Full validation

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic test prerequisites
        run: sudo apt-get update && sudo apt-get install -y bubblewrap ripgrep python3
      - name: Enable Bubblewrap user namespaces on this runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Deterministic release gate
        run: bash scripts/release-gate.sh

  windows-native:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Install Windows test prerequisites
        shell: pwsh
        run: |
          choco install ripgrep --yes --no-progress --limit-output
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Command rg.exe -ErrorAction Stop | Select-Object -ExpandProperty Source
          $rgPackage = Join-Path $env:ChocolateyInstall 'lib/ripgrep'
          $rgBinary = Get-ChildItem -LiteralPath $rgPackage -Recurse -Filter rg.exe -File |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $rgBinary) { throw "Chocolatey ripgrep package has no standalone rg.exe under $rgPackage" }
          "LATCH_TEST_RG_EXE=$rgBinary" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build native boundary with strict MSVC warnings
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsVersion = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          $generator = switch -Regex ($vsVersion) {
            '^18\.' { 'Visual Studio 18 2026'; break }
            '^17\.' { 'Visual Studio 17 2022'; break }
            default { throw "Unsupported Visual Studio installation: $vsVersion" }
          }
          Write-Output "Using $generator ($vsVersion)"
          cmake -S native/windows/boundary -B target/windows-native-ci -G $generator -A x64 -DLATCH_RECOVERY_TESTING=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build target/windows-native-ci --config Release --parallel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Native recovery, filesystem and process security
        shell: pwsh
        run: |
          $binaries = Join-Path $PWD 'target/windows-native-ci/bin'
          # .git reservation is a same-volume atomic rename from the
          # LOCALAPPDATA journal. RUNNER_TEMP may be on a separate drive.
          $fixtureBase = Join-Path $env:USERPROFILE ('LatchBoundaryCI-' + $env:GITHUB_RUN_ID)
          foreach ($suite in @('test', 'read_broker', 'write_broker', 'recovery', 'adversarial', 'lifecycle', 'network', 'scale', 'deleted_root')) {
            try {
              & "native/windows/boundary/$suite.ps1" -Binaries $binaries -FixtureRoot (Join-Path $fixtureBase "latch-native-$suite")
              if ($LASTEXITCODE) { throw "$suite exited $LASTEXITCODE" }
            } catch {
              $message = $_.Exception.Message -replace '[\r\n]+', ' '
              Write-Output "::error file=native/windows/boundary/$suite.ps1,title=Windows native fixture::$message"
              throw
            }
          }
          # Developer compatibility follows production's broker backend. The
          # legacy ACL backend above retains recovery and security coverage.
          foreach ($suite in @('developer', 'scale')) {
            & "native/windows/boundary/$suite.ps1" -Mediated -Binaries $binaries -FixtureRoot (Join-Path $fixtureBase "latch-mediated-$suite")
            if ($LASTEXITCODE) { throw "Mediated $suite exited $LASTEXITCODE" }
          }
  windows-rust:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ripgrep for sandboxed search tests
        shell: pwsh
        run: |
          choco install ripgrep --yes --no-progress --limit-output
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $rgPackage = Join-Path $env:ChocolateyInstall 'lib/ripgrep'
          $rgBinary = Get-ChildItem -LiteralPath $rgPackage -Recurse -Filter rg.exe -File |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $rgBinary) { throw "Chocolatey ripgrep package has no standalone rg.exe under $rgPackage" }
          $rgDirectory = Split-Path -Parent $rgBinary
          $rgDirectory | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $env:PATH = "$rgDirectory;$env:PATH"
          & $rgBinary --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Windows runtime smoke and release build
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Linux runs the complete workspace suite; this Windows lane checks
          # platform wiring while the native job covers the full ACL matrix.
          foreach ($test in @(
            'windows_runtime',
            'mcp',
            'skills',
            'loop_executes_registered_extension_tool',
            'loop_executes_registered_powershell_extension_tool',
            'read_only_shell_classification_is_conservative',
            'search_refuses_and_excludes_the_state_directory',
            'managed_process_start_poll_and_terminate',
            'host_registers_and_executes_external_tool',
            'auto_approve_never_overrides_hard_deny'
          )) {
            cargo test -p latch-kernel --lib $test --locked -- --test-threads=1
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          cargo test -p latch-cli --test cli doctor_reports_profile_and_credential --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --release --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
