name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - '**/*.md'
      - Cargo.toml
      - config.example.toml
      - benchmark/figures/**
      - scripts/test_site*
      - scripts/site_browser.mjs
      - scripts/install.sh
      - scripts/install.ps1
      - .github/workflows/pages.yml
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build and check documentation and official installers
        run: |
          python -m pip install -r site/requirements.txt
          python site/build.py --output _site
          python scripts/test_site.py _site
          node scripts/test_site.mjs "$(command -v google-chrome)" _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
