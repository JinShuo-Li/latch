default_mode = "WORK"
# state_dir = "/home/you/.local/state/latch"

[provider]
kind = "openai-compatible" # or "anthropic"
model = "gpt-5-mini"
# base_url = "https://api.openai.com/v1"
# api_key_env = "OPENAI_API_KEY"
# OpenCode Go (base_url under https://opencode.ai/zen/go) uses the same
# provider and additionally receives a stable x-opencode-session header.

[permissions]
workspace_write = true
outside_workspace = "deny"
shell_timeout_seconds = 120

[context]
active_bytes = 96000
recent_bytes = 48000
reserve_bytes = 16000

[failure]
retry_budget = 3
# Consecutive redundant inspection turns tolerated before the kernel
# re-grounds the model with the already-known unchanged observations.
stagnation_budget = 2

# Optional, user-configured pricing for the usage sidebar. Latch never fetches
# or invents prices; amounts are presented as estimates. Every component is
# optional, and an absent component stays unknown rather than zero.
# [models.deepseek-flash.pricing]
# input_per_million = 0.28
# output_per_million = 0.42
# cache_read_per_million = 0.028
# cache_write_per_million = 0.28
# currency = "USD"

