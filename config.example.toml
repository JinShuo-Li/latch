# Latch is Linux-first and requires the system `bwrap` (bubblewrap) binary:
# every shell, exec_start, validation, and git inspection command runs inside
# the mandatory sandbox. Latch refuses to execute commands unsandboxed.

default_mode = "WORK"
# state_dir = "/home/you/.local/state/latch"

[provider]
kind = "openai-compatible" # or "anthropic"
model = "gpt-5-mini"
# base_url = "https://api.openai.com/v1"
# api_key_env = "OPENAI_API_KEY"
# OpenCode Go (base_url under https://opencode.ai/zen/go) uses the same
# provider and additionally receives a stable x-opencode-session header.

[safety]
# Strict | Standard | Autonomous. Safety decides Allow/Ask/Deny; it never
# changes what the Mode permits.
level = "standard"

[permissions]
workspace_write = true
# Outside-workspace writes are always classified as Ask first. "deny" is a
# stricter option that refuses them outright; "ask" lets the resolver decide.
outside_workspace = "ask"
shell_timeout_seconds = 120
# How an Ask is resolved: "human" (real approval prompt), "auto_approve"
# (record Ask -> resolved automatically), or "ai_review" (separate stateless
# model review for shell commands).
mode = "human"

[context]
# All context budgets are tokens. Bytes remain only for internal file,
# artifact, log, and I/O limits.
# recent_tokens = 24000          # verbatim transcript share of the request
# output_reserve_tokens = 8192   # reserved for the model's response
# reserve_tokens = 4000          # additional safety reserve
# max_request_tokens = 200000    # explicit cap; defaults to window - reserve

[failure]
retry_budget = 3
# Consecutive redundant inspection turns tolerated before the kernel
# re-grounds the model with the already-known unchanged observations.
stagnation_budget = 2
# Ultimate abnormal-behaviour circuit breaker. Unset means unlimited: long,
# productive tasks are never killed by turn count.
# max_model_turns = 1000

# Per-model metadata. The context window defaults to 256000 tokens when not
# configured; set it explicitly to match the provider model.
# [models.deepseek-flash]
# context_window_tokens = 262144

# Optional, user-configured pricing for the usage sidebar. Latch never fetches
# or invents prices; amounts are presented as estimates. Every component is
# optional, and an absent component stays unknown rather than zero.
# [models.deepseek-flash.pricing]
# input_per_million = 0.28
# output_per_million = 0.42
# cache_read_per_million = 0.028
# cache_write_per_million = 0.28
# currency = "USD"

# [[extensions]]
# name = "example"
# command = "node"
# args = ["/absolute/path/to/extensions/example-ts/dist/index.js"]
